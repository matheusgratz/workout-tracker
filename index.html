<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRON RECOMP // Gym & Training Hub</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: #131b2e;
            --accent-volt: #ccff00;
            --accent-crimson: #ff2a5f;
            --accent-cyan: #00f2fe;
            --accent-purple: #a855f7;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #2a3752;
            --font-head: 'Impact', 'Trebuchet MS', sans-serif;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--bg-dark) 70%);
            min-height: 100vh;
        }

        .container { max-width: 680px; margin: 0 auto; }

        .app-header {
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .app-header h1 {
            font-family: var(--font-head);
            font-size: 2.2rem;
            margin: 0;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(204, 255, 0, 0.3);
        }
        .app-header h1 span { color: var(--accent-volt); }
        .app-header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent-volt);
        }

        h2 {
            font-family: var(--font-head);
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
            margin-top: 0;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
        
        input, select, button {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--accent-volt);
            box-shadow: 0 0 8px rgba(204, 255, 0, 0.2);
        }

        button {
            background: var(--accent-volt);
            color: #000000;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s ease, filter 0.2s ease;
        }
        button:active { transform: scale(0.98); }
        button:hover { filter: brightness(1.1); }

        .btn-secondary { background: #334155; color: #ffffff; }
        .btn-success { background: var(--accent-cyan); color: #000000; }
        .btn-mini { width: auto; padding: 4px 8px; font-size: 0.75rem; margin: 0; display: inline-block; }

        /* Gym Rest Timer */
        .timer-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #090d16;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        .timer-btns { display: flex; gap: 8px; }
        .timer-btn {
            width: auto;
            padding: 8px 14px;
            font-size: 0.85rem;
            margin: 0;
            background: #1e293b;
            color: var(--accent-volt);
            border: 1px solid var(--border-color);
        }
        #timer-display {
            font-family: monospace;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent-crimson);
            text-shadow: 0 0 8px rgba(255, 42, 95, 0.4);
        }

        /* Superset Block Styling */
        .superset-block {
            background: #0c1322;
            border: 1px solid var(--accent-purple);
            border-left: 4px solid var(--accent-purple);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
        }
        .superset-badge {
            background: var(--accent-purple);
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        /* Exercise Item */
        .exercise-item {
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .exercise-item:last-child { border-bottom: none; }
        .exercise-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: #ffffff; margin-bottom: 4px; }
        .target-tag {
            background: #1e293b;
            color: var(--accent-volt);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .sets-tag {
            background: #334155;
            color: var(--accent-cyan);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 4px;
        }
        .form-link { font-size: 0.8rem; color: var(--accent-cyan); text-decoration: none; font-weight: bold; }
        .past-perf { font-size: 0.8em; color: var(--accent-volt); margin: 4px 0 8px 0; font-family: monospace; }
        
        /* Set-by-Set Input Grid */
        .set-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-top: 8px;
        }
        .set-box {
            background: #090d16;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        .set-box label { font-size: 0.7rem; margin-bottom: 2px; color: var(--text-muted); }
        .set-inputs-row { display: flex; gap: 4px; }
        .set-inputs-row input { padding: 6px; font-size: 0.85rem; text-align: center; }

        .volume-badge {
            background: #0f172a;
            border: 1px dashed var(--accent-volt);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .volume-badge span { color: var(--accent-volt); font-weight: bold; font-size: 1.1rem; }

        .chart-container { position: relative; height: 260px; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h1>IRON <span>RECOMP</span></h1>
        <p>5-Day Hypertrophy & Recomposition Engine</p>
    </div>

    <!-- Data Management Header -->
    <div class="card" style="border-left-color: var(--accent-cyan);">
        <h2>💾 JSON Data Manager</h2>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn-success" onclick="exportDataFile()">Export JSON File</button>
            <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importDataFile(event)">
            <button class="btn-secondary" onclick="document.getElementById('import-file').click()">Load Local File</button>
            <button class="btn-secondary" style="background:#1e293b;" onclick="fetchRemoteJSON()">Fetch Remote JSON</button>
        </div>
        <div id="data-status" style="font-size:0.8em; color:var(--text-muted); margin-top:8px; text-align:center;">Local Storage Active</div>
    </div>

    <!-- Gym Rest Timer -->
    <div class="card" style="border-left-color: var(--accent-crimson);">
        <h2>⏱️ Iron Rest Timer</h2>
        <div class="timer-box">
            <div class="timer-btns">
                <button class="timer-btn" onclick="startTimer(60)">60S</button>
                <button class="timer-btn" onclick="startTimer(90)">90S</button>
                <button class="timer-btn" onclick="startTimer(120)">120S</button>
            </div>
            <div id="timer-display">00:00</div>
        </div>
    </div>

    <!-- Session Selection -->
    <div class="card">
        <h2>🔥 Session Setup</h2>
        <div class="form-group">
            <label for="workout-date">Date</label>
            <input type="date" id="workout-date">
        </div>
        <div class="form-group">
            <label for="workout-type">Training Phase & Day</label>
            <select id="workout-type" onchange="loadWorkoutForm()">
                <option value="">-- Choose Workout --</option>
                <optgroup label="Phase 1: Base Hypertrophy (Months 1-3)">
                    <option value="P1 - Day 1: Upper">Phase 1 - Day 1: Upper Body</option>
                    <option value="P1 - Day 2: Lower">Phase 1 - Day 2: Lower Body</option>
                    <option value="P1 - Day 3: Push">Phase 1 - Day 3: Push</option>
                    <option value="P1 - Day 4: Pull">Phase 1 - Day 4: Pull</option>
                    <option value="P1 - Day 5: Legs">Phase 1 - Day 5: Legs & V-Taper</option>
                </optgroup>
                <optgroup label="Phase 2: High Density (Months 4-6)">
                    <option value="P2 - Day 1: Upper">Phase 2 - Day 1: Upper Body</option>
                    <option value="P2 - Day 2: Lower">Phase 2 - Day 2: Lower Body</option>
                    <option value="P2 - Day 3: Push">Phase 2 - Day 3: Push</option>
                    <option value="P2 - Day 4: Pull">Phase 2 - Day 4: Pull</option>
                    <option value="P2 - Day 5: Legs">Phase 2 - Day 5: Legs & V-Taper</option>
                </optgroup>
            </select>
        </div>
    </div>

    <!-- Active Routine Logging -->
    <div id="workout-container" class="card" style="display:none; border-left-color: var(--accent-volt);">
        <h2 id="routine-title"></h2>
        <form id="workout-form">
            <div id="exercise-list"></div>
            
            <div class="volume-badge">
                Estimated Session Volume: <span id="session-volume">0</span> kg
            </div>

            <button type="button" onclick="saveWorkoutSession()">LOG WORKOUT SESSION</button>
        </form>
    </div>

    <!-- Analytics Chart -->
    <div class="card" style="border-left-color: var(--accent-cyan);">
        <h2>📈 Progression Analytics</h2>
        <div class="form-group">
            <label for="chart-exercise">Select Exercise</label>
            <select id="chart-exercise" onchange="renderChart()">
                <option value="">-- Choose Exercise --</option>
            </select>
        </div>
        <div class="chart-container">
            <canvas id="progressChart"></canvas>
        </div>
    </div>
</div>

<script>
// Master Exercise Structure with Sets & Superset Pairings
const routines = {
    "P1 - Day 1: Upper": [
        { name: "Barbell Incline Bench Press", sets: 4, target: "6-8 reps", query: "Incline+Barbell+Bench+Press", superset: null },
        { name: "Weighted Chest Dips", sets: 3, target: "8-10 reps", query: "Chest+Dips+form", superset: "SUPERSET B (Chest + Lat Width)" },
        { name: "Neutral-Grip Lat Pulldown", sets: 3, target: "8-10 reps", query: "Lat+Pulldown+form", superset: "SUPERSET B (Chest + Lat Width)" },
        { name: "Standing Cable Lateral Raises", sets: 4, target: "10-12 reps", query: "Cable+Lateral+Raise", superset: "SUPERSET C (Delts & Upper Back)" },
        { name: "Face Pulls", sets: 4, target: "12-15 reps", query: "Face+Pulls+form", superset: "SUPERSET C (Delts & Upper Back)" },
        { name: "Incline Dumbbell Bicep Curls", sets: 3, target: "10-12 reps", query: "Incline+Dumbbell+Curl", superset: null }
    ],
    "P1 - Day 2: Lower": [
        { name: "Barbell Back Squat / Hack Squat", sets: 4, target: "6-8 reps", query: "Barbell+Back+Squat", superset: null },
        { name: "Romanian Deadlift (RDL)", sets: 3, target: "8-10 reps", query: "Romanian+Deadlift", superset: null },
        { name: "Leg Press 45°", sets: 3, target: "10-12 reps", query: "Leg+Press+form", superset: "SUPERSET C (Quad & Hamstring Density)" },
        { name: "Lying or Seated Leg Curl", sets: 3, target: "10-12 reps", query: "Lying+Leg+Curl", superset: "SUPERSET C (Quad & Hamstring Density)" },
        { name: "Standing Calf Raises", sets: 4, target: "12-15 reps", query: "Standing+Calf+Raise", superset: null }
    ],
    "P1 - Day 3: Push": [
        { name: "Overhead Barbell Press (OHP)", sets: 4, target: "6-8 reps", query: "Overhead+Barbell+Press", superset: null },
        { name: "Flat Dumbbell Bench Press", sets: 3, target: "8-10 reps", query: "Dumbbell+Bench+Press", superset: "SUPERSET B (Chest & Side Delts)" },
        { name: "Dumbbell Lateral Raises", sets: 3, target: "10-12 reps", query: "Dumbbell+Lateral+Raise", superset: "SUPERSET B (Chest & Side Delts)" },
        { name: "Cable Low-to-High Flyes", sets: 3, target: "12-15 reps", query: "Cable+Low+to+High+Fly", superset: null },
        { name: "Cable Triceps Pushdowns", sets: 3, target: "10-12 reps", query: "Tricep+Pushdown", superset: "SUPERSET D (Triceps Overload)" },
        { name: "Overhead Cable Triceps Extensions", sets: 3, target: "10-12 reps", query: "Overhead+Cable+Tricep+Extension", superset: "SUPERSET D (Triceps Overload)" }
    ],
    "P1 - Day 4: Pull": [
        { name: "Heavy Barbell Row / T-Bar Row", sets: 4, target: "6-8 reps", query: "Barbell+Row", superset: null },
        { name: "Wide-Grip Lat Pulldown", sets: 3, target: "8-10 reps", query: "Wide+Grip+Lat+Pulldown", superset: "SUPERSET B (Lat Width & Thickness)" },
        { name: "Chest-Supported Seated Cable Row", sets: 3, target: "8-10 reps", query: "Seated+Cable+Row", superset: "SUPERSET B (Lat Width & Thickness)" },
        { name: "Dumbbell Rear Delt Flyes", sets: 3, target: "12-15 reps", query: "Rear+Delt+Fly", superset: null },
        { name: "EZ-Bar Preacher Curls", sets: 3, target: "8-10 reps", query: "Preacher+Curl", superset: "SUPERSET D (Bicep Hypertrophy)" },
        { name: "Cable Hammer Curls", sets: 3, target: "10-12 reps", query: "Cable+Hammer+Curl", superset: "SUPERSET D (Bicep Hypertrophy)" }
    ],
    "P1 - Day 5: Legs": [
        { name: "Bulgarian Split Squats", sets: 3, target: "8-10 reps", query: "Bulgarian+Split+Squat", superset: null },
        { name: "Leg Extensions", sets: 3, target: "12-15 reps", query: "Leg+Extension", superset: null },
        { name: "Machine Seated Calf Raises", sets: 3, target: "12-15 reps", query: "Seated+Calf+Raise", superset: "SUPERSET C (Calves & Shoulder Finisher)" },
        { name: "Heavy Cable Lateral Raises", sets: 3, target: "12-15 reps", query: "Cable+Lateral+Raise", superset: "SUPERSET C (Calves & Shoulder Finisher)" },
        { name: "Hanging Leg Raises", sets: 3, target: "15 reps", query: "Hanging+Leg+Raise", superset: null }
    ]
};

document.getElementById('workout-date').value = new Date().toISOString().split('T')[0];

let workoutHistory = JSON.parse(localStorage.getItem('iron_recomp_data')) || [];
let chartInstance = null;

function getPastPerformance(exName) {
    const pastSessions = workoutHistory
        .filter(s => s.exercises && s.exercises[exName])
        .sort((a, b) => new Date(b.date) - new Date(a.date));
    
    if (pastSessions.length > 0) {
        const last = pastSessions[0].exercises[exName];
        if (Array.isArray(last.sets)) {
            const setSummary = last.sets.map(s => `${s.weight}kg×${s.reps}`).join(', ');
            return `LAST (${pastSessions[0].date}): [${setSummary}]`;
        }
        return `LAST (${pastSessions[0].date}): ${last.weight} KG × ${last.reps} REPS`;
    }
    return "NO PAST LOG - SET YOUR BASELINE";
}

function renderExerciseHTML(ex, idx) {
    const pastText = getPastPerformance(ex.name);
    let setsHTML = '';
    
    for (let s = 1; s <= ex.sets; s++) {
        setsHTML += `
            <div class="set-box">
                <label>Set ${s}</label>
                <div class="set-inputs-row">
                    <input type="number" step="0.5" id="weight-${idx}-set-${s}" placeholder="kg" oninput="calculateTotalVolume()">
                    <input type="number" id="reps-${idx}-set-${s}" placeholder="reps" oninput="calculateTotalVolume()">
                </div>
            </div>
        `;
    }

    return `
        <div class="exercise-item">
            <div class="exercise-header">
                <span>${ex.name} <span class="sets-tag">${ex.sets} SETS</span> <span class="target-tag">${ex.target}</span></span>
                <a class="form-link" href="https://www.youtube.com/results?search_query=${ex.query}" target="_blank">FORM ↗</a>
            </div>
            <div class="past-perf">${pastText}</div>
            <div style="text-align:right;">
                <button type="button" class="btn-mini btn-secondary" onclick="copyFirstSet(${idx}, ${ex.sets})">Copy Set 1 to All</button>
            </div>
            <div class="set-grid">${setsHTML}</div>
        </div>
    `;
}

function loadWorkoutForm() {
    const key = document.getElementById('workout-type').value;
    const container = document.getElementById('workout-container');
    const list = document.getElementById('exercise-list');
    
    if (!key || !routines[key]) { container.style.display = 'none'; return; }
    
    document.getElementById('routine-title').innerText = key;
    list.innerHTML = '';

    const items = routines[key];
    let i = 0;
    while (i < items.length) {
        const current = items[i];
        if (current.superset) {
            const supersetName = current.superset;
            let supersetGroup = [];
            while (i < items.length && items[i].superset === supersetName) {
                supersetGroup.push({ ex: items[i], idx: i });
                i++;
            }
            
            let blockHTML = `<div class="superset-block"><div class="superset-badge">⚡ ${supersetName} (No Rest Between)</div>`;
            supersetGroup.forEach(groupItem => {
                blockHTML += renderExerciseHTML(groupItem.ex, groupItem.idx);
            });
            blockHTML += `</div>`;
            list.insertAdjacentHTML('beforeend', blockHTML);
        } else {
            list.insertAdjacentHTML('beforeend', renderExerciseHTML(current, i));
            i++;
        }
    }
    
    container.style.display = 'block';
    calculateTotalVolume();
}

function copyFirstSet(exIdx, totalSets) {
    const firstWeight = document.getElementById(`weight-${exIdx}-set-1`).value;
    const firstReps = document.getElementById(`reps-${exIdx}-set-1`).value;
    
    for (let s = 2; s <= totalSets; s++) {
        if (firstWeight) document.getElementById(`weight-${exIdx}-set-${s}`).value = firstWeight;
        if (firstReps) document.getElementById(`reps-${exIdx}-set-${s}`).value = firstReps;
    }
    calculateTotalVolume();
}

function calculateTotalVolume() {
    const key = document.getElementById('workout-type').value;
    if (!key || !routines[key]) return;

    let totalVolume = 0;
    routines[key].forEach((ex, idx) => {
        for (let s = 1; s <= ex.sets; s++) {
            const wEl = document.getElementById(`weight-${idx}-set-${s}`);
            const rEl = document.getElementById(`reps-${idx}-set-${s}`);
            if (wEl && rEl) {
                const weight = parseFloat(wEl.value) || 0;
                const reps = parseInt(rEl.value) || 0;
                totalVolume += (weight * reps);
            }
        }
    });

    document.getElementById('session-volume').innerText = totalVolume.toLocaleString();
}

function saveWorkoutSession() {
    const date = document.getElementById('workout-date').value;
    const key = document.getElementById('workout-type').value;
    if (!date || !key) return alert("Select date and workout.");

    const session = { date, routine: key, exercises: {} };

    routines[key].forEach((ex, idx) => {
        const setsData = [];
        let maxWeight = 0;
        let maxReps = 0;

        for (let s = 1; s <= ex.sets; s++) {
            const weight = parseFloat(document.getElementById(`weight-${idx}-set-${s}`).value) || 0;
            const reps = parseInt(document.getElementById(`reps-${idx}-set-${s}`).value) || 0;
            if (weight > 0 || reps > 0) {
                setsData.push({ set: s, weight, reps });
                if (weight > maxWeight) { maxWeight = weight; maxReps = reps; }
            }
        }

        if (setsData.length > 0) {
            session.exercises[ex.name] = {
                sets: setsData,
                weight: maxWeight, // for single-metric backwards compatibility
                reps: maxReps
            };
        }
    });

    workoutHistory = workoutHistory.filter(s => !(s.date === date && s.routine === key));
    workoutHistory.push(session);
    localStorage.setItem('iron_recomp_data', JSON.stringify(workoutHistory));

    alert("SESSION LOGGED! KEEP UP THE GAINS.");
    populateChartDropdown();
    loadWorkoutForm();
    renderChart();
}

// Rest Timer
let timer;
function startTimer(sec) {
    clearInterval(timer);
    let rem = sec;
    const el = document.getElementById('timer-display');
    timer = setInterval(() => {
        const m = String(Math.floor(rem / 60)).padStart(2, '0');
        const s = String(rem % 60).padStart(2, '0');
        el.innerText = `${m}:${s}`;
        if (--rem < 0) { 
            clearInterval(timer); 
            el.innerText = "LIFT NOW!"; 
        }
    }, 1000);
}

// Charting Engine
function populateChartDropdown() {
    const select = document.getElementById('chart-exercise');
    select.innerHTML = '<option value="">-- Choose Exercise --</option>';
    const allEx = new Set();
    Object.values(routines).flat().forEach(e => allEx.add(e.name));
    allEx.forEach(ex => select.insertAdjacentHTML('beforeend', `<option value="${ex}">${ex}</option>`));
}

function renderChart() {
    const exName = document.getElementById('chart-exercise').value;
    const ctx = document.getElementById('progressChart').getContext('2d');

    if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
    if (!exName) return;

    const filtered = workoutHistory
        .filter(s => s.exercises && s.exercises[exName])
        .sort((a, b) => new Date(a.date) - new Date(b.date));

    if (filtered.length === 0) return;

    const labels = filtered.map(s => s.date);
    const weights = filtered.map(s => s.exercises[exName].weight);
    const reps = filtered.map(s => s.exercises[exName].reps);

    chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                { label: 'Max Weight (kg)', data: weights, borderColor: '#ccff00', backgroundColor: '#ccff00', tension: 0.2, yAxisID: 'y' },
                { label: 'Max Reps', data: reps, borderColor: '#00f2fe', backgroundColor: '#00f2fe', tension: 0.2, yAxisID: 'y1' }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
                y: { type: 'linear', display: true, position: 'left', ticks: { color: '#ccff00' }, grid: { color: '#1e293b' } },
                y1: { type: 'linear', display: true, position: 'right', ticks: { color: '#00f2fe' }, grid: { drawOnChartArea: false } }
            },
            plugins: { legend: { labels: { color: '#ffffff' } } }
        }
    });
}

// Data Manager Functions
function exportDataFile() {
    const str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(workoutHistory, null, 2));
    const anchor = document.createElement('a');
    anchor.setAttribute("href", str);
    anchor.setAttribute("download", "iron_recomp_data.json");
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
}

function importDataFile(event) {
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            workoutHistory = JSON.parse(e.target.result);
            localStorage.setItem('iron_recomp_data', JSON.stringify(workoutHistory));
            document.getElementById('data-status').innerText = `Data Loaded: ${workoutHistory.length} sessions.`;
            populateChartDropdown();
            alert("JSON Data File Loaded Successfully!");
        } catch (err) {
            alert("Invalid JSON file format.");
        }
    };
    reader.readAsText(event.target.files[0]);
}

function fetchRemoteJSON() {
    fetch('iron_recomp_data.json')
        .then(res => res.json())
        .then(data => {
            workoutHistory = data;
            localStorage.setItem('iron_recomp_data', JSON.stringify(workoutHistory));
            document.getElementById('data-status').innerText = `Remote File Synced: ${workoutHistory.length} sessions.`;
            populateChartDropdown();
            alert("Remote JSON file synced successfully!");
        })
        .catch(err => {
            alert("Could not load 'iron_recomp_data.json' from server/repo. Use 'Load Local File' to select it manually.");
        });
}

populateChartDropdown();
</script>
</body>
</html>
