<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRON RECOMP // Gym & Training Hub</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: #131b2e;
            --accent-volt: #ccff00;
            --accent-crimson: #ff2a5f;
            --accent-cyan: #00f2fe;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #2a3752;
            --font-head: 'Impact', 'Trebuchet MS', sans-serif;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--bg-dark) 70%);
            min-height: 100vh;
        }

        .container { max-width: 650px; margin: 0 auto; }

        /* Gym Header Style */
        .app-header {
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .app-header h1 {
            font-family: var(--font-head);
            font-size: 2.2rem;
            margin: 0;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(204, 255, 0, 0.3);
        }
        .app-header h1 span { color: var(--accent-volt); }
        .app-header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

        /* Cards & Containers */
        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent-volt);
        }

        h2 {
            font-family: var(--font-head);
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
            margin-top: 0;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
        
        input, select, button {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--accent-volt);
            box-shadow: 0 0 8px rgba(204, 255, 0, 0.2);
        }

        button {
            background: var(--accent-volt);
            color: #000000;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s ease, filter 0.2s ease;
        }
        button:active { transform: scale(0.98); }
        button:hover { filter: brightness(1.1); }

        .btn-secondary { background: #334155; color: #ffffff; }
        .btn-success { background: var(--accent-cyan); color: #000000; }

        /* Gym Timer */
        .timer-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #090d16;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        .timer-btns { display: flex; gap: 8px; }
        .timer-btn {
            width: auto;
            padding: 8px 14px;
            font-size: 0.85rem;
            margin: 0;
            background: #1e293b;
            color: var(--accent-volt);
            border: 1px solid var(--border-color);
        }
        #timer-display {
            font-family: monospace;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent-crimson);
            text-shadow: 0 0 8px rgba(255, 42, 95, 0.4);
        }

        /* Exercise Rows */
        .exercise-row {
            border-bottom: 1px solid var(--border-color);
            padding: 14px 0;
        }
        .exercise-row:last-child { border-bottom: none; }
        .exercise-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: #ffffff; }
        .target-tag {
            background: #1e293b;
            color: var(--accent-volt);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: normal;
        }
        .form-link { font-size: 0.8rem; color: var(--accent-cyan); text-decoration: none; font-weight: bold; }
        .past-perf { font-size: 0.82em; color: var(--accent-volt); margin: 6px 0; font-family: monospace; }
        .set-inputs { display: flex; gap: 10px; }

        /* Stats & Volume Badge */
        .volume-badge {
            background: #0f172a;
            border: 1px dashed var(--accent-volt);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .volume-badge span { color: var(--accent-volt); font-weight: bold; font-size: 1.1rem; }

        /* Chart */
        .chart-container { position: relative; height: 260px; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h1>IRON <span>RECOMP</span></h1>
        <p>5-Day Hypertrophy & Recomposition Engine</p>
    </div>

    <!-- Data Management Header -->
    <div class="card" style="border-left-color: var(--accent-cyan);">
        <h2>💾 Data Sync & Backup</h2>
        <div style="display:flex; gap:8px;">
            <button class="btn-success" onclick="exportDataFile()">Export Data (JSON)</button>
            <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importDataFile(event)">
            <button class="btn-secondary" onclick="document.getElementById('import-file').click()">Load Data File</button>
        </div>
        <div id="data-status" style="font-size:0.8em; color:var(--text-muted); margin-top:8px; text-align:center;">Local Storage Active</div>
    </div>

    <!-- Gym Rest Timer with Audio Beep -->
    <div class="card" style="border-left-color: var(--accent-crimson);">
        <h2>⏱️ Iron Rest Timer</h2>
        <div class="timer-box">
            <div class="timer-btns">
                <button class="timer-btn" onclick="startTimer(60)">60S</button>
                <button class="timer-btn" onclick="startTimer(90)">90S</button>
                <button class="timer-btn" onclick="startTimer(120)">120S</button>
            </div>
            <div id="timer-display">00:00</div>
        </div>
    </div>

    <!-- Session Selection -->
    <div class="card">
        <h2>🔥 Session Setup</h2>
        <div class="form-group">
            <label for="workout-date">Date</label>
            <input type="date" id="workout-date">
        </div>
        <div class="form-group">
            <label for="workout-type">Training Phase & Day</label>
            <select id="workout-type" onchange="loadWorkoutForm()">
                <option value="">-- Choose Workout --</option>
                <optgroup label="Phase 1: Base Hypertrophy (Months 1-3)">
                    <option value="P1 - Day 1: Upper">Phase 1 - Day 1: Upper Body</option>
                    <option value="P1 - Day 2: Lower">Phase 1 - Day 2: Lower Body</option>
                    <option value="P1 - Day 3: Push">Phase 1 - Day 3: Push</option>
                    <option value="P1 - Day 4: Pull">Phase 1 - Day 4: Pull</option>
                    <option value="P1 - Day 5: Legs">Phase 1 - Day 5: Legs & V-Taper</option>
                </optgroup>
                <optgroup label="Phase 2: High Density (Months 4-6)">
                    <option value="P2 - Day 1: Upper">Phase 2 - Day 1: Upper Body</option>
                    <option value="P2 - Day 2: Lower">Phase 2 - Day 2: Lower Body</option>
                    <option value="P2 - Day 3: Push">Phase 2 - Day 3: Push</option>
                    <option value="P2 - Day 4: Pull">Phase 2 - Day 4: Pull</option>
                    <option value="P2 - Day 5: Legs">Phase 2 - Day 5: Legs & V-Taper</option>
                </optgroup>
            </select>
        </div>
    </div>

    <!-- Active Routine Logging -->
    <div id="workout-container" class="card" style="display:none; border-left-color: var(--accent-volt);">
        <h2 id="routine-title"></h2>
        <form id="workout-form">
            <div id="exercise-list"></div>
            
            <div class="volume-badge">
                Estimated Session Volume: <span id="session-volume">0</span> kg
            </div>

            <button type="button" onclick="saveWorkoutSession()">LOG WORKOUT SESSION</button>
        </form>
    </div>

    <!-- Analytics Chart -->
    <div class="card" style="border-left-color: var(--accent-cyan);">
        <h2>📈 Progression Analytics</h2>
        <div class="form-group">
            <label for="chart-exercise">Select Exercise</label>
            <select id="chart-exercise" onchange="renderChart()">
                <option value="">-- Choose Exercise --</option>
            </select>
        </div>
        <div class="chart-container">
            <canvas id="progressChart"></canvas>
        </div>
    </div>
</div>

<script>
// Master Exercise Database (Supports Phase 1 and Phase 2)
const routines = {
    // PHASE 1
    "P1 - Day 1: Upper": [
        { name: "Barbell Incline Bench Press", target: "6-8 reps", query: "Incline+Barbell+Bench+Press" },
        { name: "Weighted Chest Dips", target: "8-10 reps", query: "Chest+Dips+form" },
        { name: "Neutral-Grip Lat Pulldown", target: "8-10 reps", query: "Lat+Pulldown+form" },
        { name: "Standing Cable Lateral Raises", target: "10-12 reps", query: "Cable+Lateral+Raise" },
        { name: "Face Pulls", target: "12-15 reps", query: "Face+Pulls+form" },
        { name: "Incline Dumbbell Bicep Curls", target: "10-12 reps", query: "Incline+Dumbbell+Curl" }
    ],
    "P1 - Day 2: Lower": [
        { name: "Barbell Back Squat / Hack Squat", target: "6-8 reps", query: "Barbell+Back+Squat" },
        { name: "Romanian Deadlift (RDL)", target: "8-10 reps", query: "Romanian+Deadlift" },
        { name: "Leg Press 45°", target: "10-12 reps", query: "Leg+Press+form" },
        { name: "Lying or Seated Leg Curl", target: "10-12 reps", query: "Lying+Leg+Curl" },
        { name: "Standing Calf Raises", target: "12-15 reps", query: "Standing+Calf+Raise" }
    ],
    "P1 - Day 3: Push": [
        { name: "Overhead Barbell Press (OHP)", target: "6-8 reps", query: "Overhead+Barbell+Press" },
        { name: "Flat Dumbbell Bench Press", target: "8-10 reps", query: "Dumbbell+Bench+Press" },
        { name: "Dumbbell Lateral Raises", target: "10-12 reps", query: "Dumbbell+Lateral+Raise" },
        { name: "Cable Low-to-High Flyes", target: "12-15 reps", query: "Cable+Low+to+High+Fly" },
        { name: "Cable Triceps Pushdowns", target: "10-12 reps", query: "Tricep+Pushdown" },
        { name: "Overhead Cable Triceps Extensions", target: "10-12 reps", query: "Overhead+Cable+Tricep+Extension" }
    ],
    "P1 - Day 4: Pull": [
        { name: "Heavy Barbell Row / T-Bar Row", target: "6-8 reps", query: "Barbell+Row" },
        { name: "Wide-Grip Lat Pulldown", target: "8-10 reps", query: "Wide+Grip+Lat+Pulldown" },
        { name: "Chest-Supported Seated Cable Row", target: "8-10 reps", query: "Seated+Cable+Row" },
        { name: "Dumbbell Rear Delt Flyes", target: "12-15 reps", query: "Rear+Delt+Fly" },
        { name: "EZ-Bar Preacher Curls", target: "8-10 reps", query: "Preacher+Curl" },
        { name: "Cable Hammer Curls", target: "10-12 reps", query: "Cable+Hammer+Curl" }
    ],
    "P1 - Day 5: Legs": [
        { name: "Bulgarian Split Squats", target: "8-10 reps", query: "Bulgarian+Split+Squat" },
        { name: "Leg Extensions", target: "12-15 reps", query: "Leg+Extension" },
        { name: "Machine Seated Calf Raises", target: "12-15 reps", query: "Seated+Calf+Raise" },
        { name: "Heavy Cable Lateral Raises", target: "12-15 reps", query: "Cable+Lateral+Raise" },
        { name: "Hanging Leg Raises", target: "15 reps", query: "Hanging+Leg+Raise" }
    ],

    // PHASE 2 (Template for future rotation)
    "P2 - Day 1: Upper": [
        { name: "Incline Dumbbell Bench Press", target: "8-10 reps", query: "Incline+Dumbbell+Press" },
        { name: "Weighted Pull-ups / Chin-ups", target: "6-8 reps", query: "Weighted+Pull+ups" },
        { name: "Standing Dumbbell Shoulder Press", target: "8-10 reps", query: "Dumbbell+Shoulder+Press" },
        { name: "Low-to-High Cable Flyes", target: "10-12 reps", query: "Cable+Flyes" },
        { name: "EZ-Bar Skullcrushers", target: "10-12 reps", query: "Skullcrushers" },
        { name: "Bayesian Cable Bicep Curls", target: "12-15 reps", query: "Bayesian+Curl" }
    ]
};

// Set Default Date
document.getElementById('workout-date').value = new Date().toISOString().split('T')[0];

// Storage
let workoutHistory = JSON.parse(localStorage.getItem('workout_history_v2')) || [];
let chartInstance = null;

function getPastPerformance(exName) {
    const pastSessions = workoutHistory
        .filter(s => s.exercises && s.exercises[exName])
        .sort((a, b) => new Date(b.date) - new Date(a.date));
    
    if (pastSessions.length > 0) {
        const last = pastSessions[0].exercises[exName];
        return `LAST LOG (${pastSessions[0].date}): ${last.weight} KG × ${last.reps} REPS`;
    }
    return "NO PAST LOG - SET YOUR BASELINE";
}

function loadWorkoutForm() {
    const key = document.getElementById('workout-type').value;
    const container = document.getElementById('workout-container');
    const list = document.getElementById('exercise-list');
    
    if (!key) { container.style.display = 'none'; return; }
    
    document.getElementById('routine-title').innerText = key;
    list.innerHTML = '';
    
    routines[key].forEach((ex, idx) => {
        const pastText = getPastPerformance(ex.name);
        const html = `
            <div class="exercise-row">
                <div class="exercise-header">
                    <span>${ex.name} <span class="target-tag">${ex.target}</span></span>
                    <a class="form-link" href="https://www.youtube.com/results?search_query=${ex.query}" target="_blank">FORM ↗</a>
                </div>
                <div class="past-perf">${pastText}</div>
                <div class="set-inputs">
                    <input type="number" step="0.5" id="weight-${idx}" placeholder="Weight (kg)" oninput="calculateTotalVolume()">
                    <input type="number" id="reps-${idx}" placeholder="Reps achieved" oninput="calculateTotalVolume()">
                </div>
            </div>
        `;
        list.insertAdjacentHTML('beforeend', html);
    });
    
    container.style.display = 'block';
    calculateTotalVolume();
}

function calculateTotalVolume() {
    const key = document.getElementById('workout-type').value;
    if (!key || !routines[key]) return;

    let totalVolume = 0;
    routines[key].forEach((_, idx) => {
        const weight = parseFloat(document.getElementById(`weight-${idx}`).value) || 0;
        const reps = parseInt(document.getElementById(`reps-${idx}`).value) || 0;
        totalVolume += (weight * reps);
    });

    document.getElementById('session-volume').innerText = totalVolume.toLocaleString();
}

function saveWorkoutSession() {
    const date = document.getElementById('workout-date').value;
    const key = document.getElementById('workout-type').value;
    if (!date || !key) return alert("Select date and workout.");

    const session = { date, routine: key, exercises: {} };

    routines[key].forEach((ex, idx) => {
        const weight = parseFloat(document.getElementById(`weight-${idx}`).value) || 0;
        const reps = parseInt(document.getElementById(`reps-${idx}`).value) || 0;
        if (weight > 0 || reps > 0) {
            session.exercises[ex.name] = { weight, reps };
        }
    });

    workoutHistory = workoutHistory.filter(s => !(s.date === date && s.routine === key));
    workoutHistory.push(session);
    localStorage.setItem('workout_history_v2', JSON.stringify(workoutHistory));

    alert("SESSION LOGGED! KEEP UP THE GAINS.");
    populateChartDropdown();
    loadWorkoutForm();
    renderChart();
}

// Synthesized Audio Beep for Rest Timer
function playTimerBeep() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime); // 880Hz pitch
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
    } catch (e) {
        console.log("Audio play blocked");
    }
}

let timer;
function startTimer(sec) {
    clearInterval(timer);
    let rem = sec;
    const el = document.getElementById('timer-display');
    timer = setInterval(() => {
        const m = String(Math.floor(rem / 60)).padStart(2, '0');
        const s = String(rem % 60).padStart(2, '0');
        el.innerText = `${m}:${s}`;
        if (--rem < 0) { 
            clearInterval(timer); 
            el.innerText = "LIFT NOW!"; 
            playTimerBeep(); 
        }
    }, 1000);
}

// Dark Mode Styled Charting
function populateChartDropdown() {
    const select = document.getElementById('chart-exercise');
    select.innerHTML = '<option value="">-- Choose Exercise --</option>';
    const allEx = new Set();
    Object.values(routines).flat().forEach(e => allEx.add(e.name));
    allEx.forEach(ex => select.insertAdjacentHTML('beforeend', `<option value="${ex}">${ex}</option>`));
}

function renderChart() {
    const exName = document.getElementById('chart-exercise').value;
    const ctx = document.getElementById('progressChart').getContext('2d');

    if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
    if (!exName) return;

    const filtered = workoutHistory
        .filter(s => s.exercises && s.exercises[exName])
        .sort((a, b) => new Date(a.date) - new Date(b.date));

    if (filtered.length === 0) return;

    const labels = filtered.map(s => s.date);
    const weights = filtered.map(s => s.exercises[exName].weight);
    const reps = filtered.map(s => s.exercises[exName].reps);

    chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                { label: 'Weight (kg)', data: weights, borderColor: '#ccff00', backgroundColor: '#ccff00', tension: 0.2, yAxisID: 'y' },
                { label: 'Reps', data: reps, borderColor: '#00f2fe', backgroundColor: '#00f2fe', tension: 0.2, yAxisID: 'y1' }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
                y: { type: 'linear', display: true, position: 'left', ticks: { color: '#ccff00' }, grid: { color: '#1e293b' } },
                y1: { type: 'linear', display: true, position: 'right', ticks: { color: '#00f2fe' }, grid: { drawOnChartArea: false } }
            },
            plugins: {
                legend: { labels: { color: '#ffffff' } }
            }
        }
    });
}

// Backup & Restore
function exportDataFile() {
    const str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(workoutHistory, null, 2));
    const anchor = document.createElement('a');
    anchor.setAttribute("href", str);
    anchor.setAttribute("download", "iron_recomp_data.json");
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
}

function importDataFile(event) {
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            workoutHistory = JSON.parse(e.target.result);
            localStorage.setItem('workout_history_v2', JSON.stringify(workoutHistory));
            document.getElementById('data-status').innerText = `Active File: ${workoutHistory.length} sessions stored.`;
            populateChartDropdown();
            alert("Data Loaded Successfully!");
        } catch (err) {
            alert("Invalid File Format.");
        }
    };
    reader.readAsText(event.target.files[0]);
}

// Init
populateChartDropdown();
</script>
</body>
</html>
